<div id="ai-chat-box" style="
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 300px;
  background: white;
  border: 1px solid #ccc;
  padding: 10px;
  z-index: 9999;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
">
  <h4>AI Chat 🤖</h4>

  <div id="chat-messages" style="
    height: 150px;
    overflow-y: auto;
    border: 1px solid #eee;
    padding: 5px;
    margin-bottom: 10px;
  "></div>

  <input
    id="msg"
    placeholder="Type message..."
    style="width: 100%; padding: 5px; box-sizing: border-box;"
    onkeydown="if(event.key==='Enter') sendMessage()"
  />
  <button
    onclick="sendMessage()"
    style="margin-top: 5px; width: 100%; padding: 6px; cursor: pointer;"
  >Send</button>

  <div id="chat-status" style="font-size:12px; color:gray; margin-top:5px;"></div>
</div>

<script>
async function sendMessage() {
  const msgInput = document.getElementById("msg");
  const msg = msgInput.value.trim();
  const statusEl = document.getElementById("chat-status");
  const messagesEl = document.getElementById("chat-messages");

  if (!msg) return;

  // Show user message immediately
  messagesEl.innerHTML += `<p><b>You:</b> ${msg}</p>`;
  msgInput.value = "";
  statusEl.textContent = "AI is typing...";

  // Auto scroll
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const res = await fetch("https://ai-chat-3hqm.onrender.com/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg })
    });

    if (!res.ok) {
      throw new Error(`Server error: ${res.status}`);
    }

    const data = await res.json();
    const reply = data.reply || "No response";

    messagesEl.innerHTML += `<p><b>AI:</b> ${reply}</p>`;

  } catch (err) {
    messagesEl.innerHTML += `<p style="color:red;"><b>Error:</b> ${err.message} — Server may be waking up, try again!</p>`;
  } finally {
    statusEl.textContent = "";
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}
</script>
